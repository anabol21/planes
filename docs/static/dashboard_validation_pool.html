<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>planes — прототип планирования авиасъёмки</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>

  :root {
    --bg:#06101a;
    --panel:#0b1726;
    --panel2:#0e1c2e;
    --ink:#e8f1f8;
    --muted:#8aa0b5;
    --accent:#38bdf8;
    --accent-dim:#0ea5e955;
    --ok:#34d399;
    --bad:#f87171;
    --warn:#fbbf24;
    --line:#1e3348;
    --line2:#29425f;
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #0b2a3d 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #0a1f30 0%, transparent 50%),
                var(--bg);
    color:var(--ink);
  }
  header {
    padding:16px 20px 14px;
    border-bottom:1px solid var(--line);
    display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end;
    background: rgba(6,16,26,.92);
    backdrop-filter: blur(8px);
  }
  header .brand { flex:1; min-width:240px; }
  header .eyebrow {
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:650; margin:0 0 4px;
  }
  header h1 { margin:0; font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  header .sub { color:var(--muted); font-size:13px; margin-top:4px; }
  header .meta { color:var(--muted); font-size:11px; opacity:.85; }
  .tabs {
    display:flex; flex-wrap:wrap; gap:6px;
    padding:10px 14px; border-bottom:1px solid var(--line);
    background: var(--panel);
  }
  .tab {
    border:1px solid var(--line2); background:var(--panel2); color:var(--ink);
    padding:7px 11px; border-radius:9px; cursor:pointer; font-size:12px;
    transition: border-color .12s, box-shadow .12s;
  }
  .tab:hover { border-color: var(--accent); }
  .tab.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-dim) inset, 0 0 18px #38bdf822;
    background: #0b2a3d;
  }
  .tab .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  .tab .dot.ok { background:var(--ok); }
  .tab .dot.bad { background:var(--bad); }
  .tab .dot.na { background:#556; }
  .layout { display:grid; grid-template-columns: 1fr 360px; height: calc(100vh - 128px); }
  #map { width:100%; height:100%; background:#040b12; }
  aside {
    border-left:1px solid var(--line);
    background: linear-gradient(180deg, var(--panel) 0%, #081421 100%);
    overflow:auto; padding:16px;
  }
  aside h2 { margin:0 0 8px; font-size:15px; font-weight:650; }
  aside h3, aside .sec {
    margin:16px 0 8px; font-size:12px; font-weight:650;
    color:var(--accent); letter-spacing:.04em; text-transform:uppercase;
  }
  .kv { display:grid; grid-template-columns: 1fr auto; gap:5px 10px; font-size:12px; margin-bottom:12px; }
  .kv span { color:var(--muted); }
  .kv b { font-weight:600; text-align:right; color:var(--ink); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:650; margin-right:4px; }
  .badge.ok { background:#0a2f24; color:var(--ok); border:1px solid #1a5c45; }
  .badge.bad { background:#3a1515; color:var(--bad); border:1px solid #6b2a2a; }
  .badge.na { background:#1a2430; color:#aab; border:1px solid var(--line2); }
  .cap {
    font-size:12.5px; color:#b7c7d8; line-height:1.55;
    margin:10px 0 14px; white-space:pre-line;
    background:#081825; border:1px solid var(--line); border-radius:10px; padding:10px 12px;
  }
  .lim { font-size:11.5px; color:var(--muted); margin:0; padding-left:16px; }
  .lim li { margin:4px 0; }
  .chips { display:flex; flex-direction:column; gap:8px; }
  .chip {
    border:1px solid var(--line2); border-radius:12px; padding:11px;
    cursor:pointer; background:#081825;
  }
  .chip:hover { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent-dim); }
  .routes { font-size:11px; margin-top:8px; }
  .routes div { margin:3px 0; }
  footer.foot {
    border-top:1px solid var(--line); padding:6px 14px;
    font-size:10.5px; color:var(--muted); background:var(--bg);
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; height:auto; }
    #map { height:52vh; }
  }
  .layout.brief-mode { grid-template-columns: 1fr; }
  .layout.brief-mode #map { display:none; }
  .layout.brief-mode aside { border-left:none; max-width:860px; margin:0 auto; width:100%; }
  .brief-doc { font-size:13.5px; line-height:1.55; color:var(--ink); }
  .brief-doc .eyebrow {
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent); font-weight:650; margin:0 0 6px;
  }
  .brief-doc h1 { font-size:22px; margin:0 0 8px; letter-spacing:-0.01em; }
  .brief-doc .lead { color:#b7c7d8; margin:0 0 14px; font-size:14px; }
  .brief-doc h2 {
    font-size:14px; margin:22px 0 8px; color:var(--accent);
    border-bottom:1px solid var(--line); padding-bottom:5px;
    letter-spacing:.03em; text-transform:uppercase; font-weight:650;
  }
  .brief-doc p { margin:6px 0; color:#d5dde8; }
  .brief-doc ul { margin:6px 0 10px; padding-left:18px; color:#c5d0de; }
  .brief-doc li { margin:4px 0; }
  .brief-doc code {
    background:#06111c; padding:1px 5px; border-radius:4px;
    font-size:11.5px; color:var(--accent); border:1px solid var(--line);
  }
  .brief-doc .callout {
    background:#082d3a; border-left:3px solid var(--accent);
    padding:10px 12px; border-radius:8px; margin:10px 0 16px; color:#d7e8f3;
  }
  .brief-doc table.brief-table {
    width:100%; border-collapse:collapse; font-size:12.5px; margin:10px 0 14px;
  }
  .brief-doc table.brief-table th,
  .brief-doc table.brief-table td {
    border:1px solid var(--line); padding:7px 9px; text-align:left; vertical-align:top;
  }
  .brief-doc table.brief-table th { background:#0a1a28; color:var(--accent); }
  .brief-doc strong { color:#fff; font-weight:650; }
  .brief-doc .foot-note { color:var(--muted); font-size:12px; margin-top:18px; }

</style>
</head>

<script>
const DATA = {"meta":{"title":"planes — прототип планирования авиасъёмки","generated_at":"2026-09-29 23:22:11 MSK","merge_commit":"b9dbef1647a6d23177d74fa9c6521f7736abfda1","host":"[REDACTED]","note":"Standalone HTML; DATA embedded. Expert-facing prototype. Inter-zone transit lines hidden. Extended with T01/T03/T08/T05 + SURVEY5 границы/energy. SKIPPED optional A6-like terrain from dashboard_terrain_prod_swaths.html (A6 already shows local DEM ASL; SURVEY5 terrain case has 27 routes — too heavy/ops-y).","brief_title":"О продукте","subtitle":"Демонстрация сценариев для эксперта"},"cases":[{"id":"BRIEF_GRISHA","label":"О продукте","brief":true,"panel":{"outcome":"brief","pass":true,"source":"docs","caption":"Продуктовый обзор для эксперта","limitations":[]},"brief_html":"\n<div class=\"eyebrow\">planes · прототип</div>\n<h1>Планирование авиасъёмки БВС</h1>\n<p class=\"lead\">Демонстрация сценариев для эксперта / жюри. Ниже — живые результаты солвера на тестовой геометрии: что система умеет сейчас и где границы честны.</p>\n\n<div class=\"callout\">\n  <b>Как пользоваться этим прототипом.</b> Вкладка «О продукте» — краткий обзор. Остальные вкладки — сценарии на карте: слева геометрия и галсы, справа метрики и ограничения. Зелёная/красная точка у вкладки — ожидаемый исход сценария (PASS/FAIL по контракту демо), не «оценка жюри».\n</div>\n\n<h2>Что делает система</h2>\n<ul>\n  <li>Принимает зоны съёмки, площадки (ВПП), ограничения (NFZ) и параметры флота.</li>\n  <li>Строит галсы покрытия и собирает маршрут(ы) БВС: взлёт → съёмка → посадка.</li>\n  <li>Учитывает флаги: чужая посадка, дозарядка между вылетами, горизонтальное разнесение бортов.</li>\n  <li>При наличии DEM выставляет высоты waypoints как ASL = рельеф + AGL (время миссии при этом остаётся 2D).</li>\n</ul>\n\n<h2>Как читать вкладки</h2>\n<table class=\"brief-table\">\n  <tr><th>Вкладка</th><th>Смысл для эксперта</th></tr>\n  <tr><td><b>A1 · Обход NFZ</b></td><td>Галсы обходят зоны ограничений рядом с полигонами съёмки.</td></tr>\n  <tr><td><b>T01 · Базовая малая</b></td><td>Малый полигон + одна ВПП, плоский mono; контрольный зум.</td></tr>\n  <tr><td><b>T03 · Крупный полигон</b></td><td>Более крупная зона съёмки, один борт.</td></tr>\n  <tr><td><b>T08 · Нерегулярный + VPP_B</b></td><td>Нерегулярная геометрия и смещённая ВПП_B.</td></tr>\n  <tr><td><b>T05 · Смежное ограничение</b></td><td>NFZ рядом с зоной, без пересечения.</td></tr>\n  <tr><td><b>SURVEY5 · Границы</b></td><td>5 полигонов + 2 ВПП + 2 борта (реальная геометрия).</td></tr>\n  <tr><td><b>SURVEY5 · Энергия</b></td><td>Один вариант: энергия / параллельная укладка (polyclose_energy).</td></tr>\n  <tr><td><b>A6 · Рельеф</b></td><td>Кейс с <b>локальным</b> DEM: ASL по рельефу; без модели climb в длительности.</td></tr>\n  <tr><td><b>A8 · Сводка</b></td><td>Все live-исходы одним экраном.</td></tr>\n</table>\n\n<h2>Честные границы (не обещаем)</h2>\n<ul>\n  <li><b>Рельеф в проде:</b> этот прототип <b>не</b> утверждает, что live VPS сейчас тянет OpenTopo / COP30. Кейс A6 — с локальным GeoTIFF.</li>\n  <li><b>Высоты:</b> при DEM есть ASL = terrain + AGL; <b>время набора/снижения в длительность миссии не входит</b>.</li>\n  <li><b>Дозарядка:</b> константный gap (<code>recharge_time_s</code>), не Wh-логистика батарей.</li>\n  <li><b>Разнесение БВС:</b> горизонтальная space–time эвристика, не сертифицированный ATM и не полный 3D-safety.</li>\n  <li><b>NFZ:</b> учитывается при построении галсов; это не полная 3D-модель безопасности.</li>\n  <li><b>Экспорт:</b> KML / готовый план полёта в этот HTML-прототип не входит.</li>\n  <li><b>Оптимум:</b> эвристика; глобальный оптимум не гарантируется.</li>\n</ul>\n\n<h2>Легенда карты</h2>\n<ul>\n  <li><span style=\"color:#38bdf8\">■</span> зоны съёмки</li>\n  <li><span style=\"color:#f87171\">▨</span> NFZ / препятствия</li>\n  <li><span style=\"color:#fbbf24\">●</span> площадки (ВПП)</li>\n  <li>цветные линии — галсы бортов (транзиты между зонами скрыты)</li>\n</ul>\n\n<p class=\ const hdr = document.getElementById('hdr');
const foot = document.getElementById('foot');
const gen = DATA.meta.generated_at || '';
const sha = (DATA.meta.merge_commit || '').slice(0, 10);
hdr.textContent = gen ? `прогон ${gen}` : '';
foot.textContent = sha
  ? `офлайн-прототип · данные встроены · merge ${sha}`
  : 'офлайн-прототип · данные встроены';

const map = L.map('map', { zoomControl: true });
const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Tiles &copy; Esri'
});
const carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, attribution: '&copy; OSM &copy; CARTO'
});
esri.addTo(map);
L.control.layers({ 'Esri imagery': esri, 'Carto dark': carto }, {}).addTo(map);

let layerGroup = L.layerGroup().addTo(map);
let activeId = DATA.cases.find(x => x.id === 'BRIEF_GRISHA')?.id || DATA.cases[0]?.id;

function fmt(v, digits=1) {
  if (v === null || v === undefined || Number.isNaN(v)) return '—';
  if (typeof v === 'number') return v.toFixed(digits);
  return String(v);
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  for (const c of DATA.cases) {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c.id === activeId ? ' active' : '');
    const p = c.panel || {};
    let cls = 'na';
    if (c.brief) cls = 'na';
    else if (p.pass === true) cls = 'ok';
    else if (p.pass === false) cls = 'bad';
    const syn = (p.source === 'synthetic_packer') ? '' : '';
    btn.innerHTML = `<span class="dot ${cls}"></span>${c.label}${syn}`;
    btn.onclick = () => { activeId = c.id; renderTabs(); renderCase(); };
    nav.appendChild(btn);
  }
}

function renderCase() {
  const c = DATA.cases.find(x => x.id === activeId) || DATA.cases[0];
  const p = c.panel || {};
  layerGroup.clearLayers();

  const layout = document.querySelector('.layout');
  const panel = document.getElementById('panel');
  const badgeCls = p.pass === true ? 'ok' : (p.pass === false ? 'bad' : 'na');

  const outcomeRu = ({
    feasible: 'выполнимо',
    infeasible: 'невыполнимо',
    collage: 'сводка'
  })[p.outcome] || (p.outcome || '');

    layout.classList.add('brief-mode');
    panel.innerHTML = `<div class="brief-doc">${c.brief_html || '<p>Обзор не вшит</p>'}</div>`;

      <span>задержка разнесения, с</span><b>${fmt(p.separation_delay_s,1)}</b>
      <span>бортов / маршрутов</span><b>${fmt(p.uav_used,0)} / ${fmt(p.route_count,0)}</b>
      <span>непокрытых галсов</span><b>${fmt(p.uncovered_swaths,0)}</b>
      <span>ВПП взлёта</span><b>${(p.takeoff_pads||[]).join(', ')||'—'}</b>
      <span>ВПП посадки</span><b>${(p.landing_pads||[]).join(', ')||'—'}</b>
      <span>start_time_s</span><b>${(p.starts||[]).map(x=>fmt(x,1)).join(' · ')||'—'}</b>
      <span>recharge_before_s</span><b>${(p.recharges||[]).map(x=>fmt(x,1)).join(' · ')||'—'}</b>
      <span>DEM</span><b>${demShow}</b>
      <span>wall_s</span><b>${fmt(p.wall_s,2)}</b>
    </div>
    <div class="sec">Флаги сценария</div>
    <div class="kv">
      ${Object.keys(flags).length ? Object.entries(flags).map(([k,v])=>`<span>${k}</span><b>${v===undefined||v===null?'—':String(v)}</b>`).join('') : '<span>(нет / синтетика)</span><b></b>'}
    </div>
    <div class="sec">Маршруты (только галсы)</div>
    <div class="routes">${(c.routes||[]).map(r=>`<div style="color:${r.color}">● ${r.uav_id} #${r.flight_index}
      TO=${r.takeoff_vpp_id} → LD=${r.landing_vpp_id}
      start=${fmt(r.start_time_s,1)} rech=${fmt(r.recharge_before_s,1)}
      alt[${fmt(r.alt_min,0)}–${fmt(r.alt_max,0)}]
      segs=${(r.swaths||[]).length}</div>`).join('') || '<div class="cap" style="white-space:normal">Нет маршрутов (невыполнимо / сводка)</div>'}
    </div>
    <div class="sec">Честные ограничения</div>
    <ul class="lim">${(p.limitations||[]).slice(0,10).map(x=>`<li>${x}</li>`).join('') || '<li>—</li>'}</ul>
  `;
  drawGeometry(c);
}

function drawGeometry(c) {
  layerGroup.clearLayers();
  const bounds = [];
  for (const s of (c.surveys||[])) {
    for (const ring of (s.rings||[])) {
      const poly = L.polygon(ring, { color:'#38bdf8', weight:2, fillColor:'#38bdf8', fillOpacity:0.14 });
      poly.bindTooltip(s.id||'съёмка');
      layerGroup.addLayer(poly);
      ring.forEach(ll => bounds.push(ll));
    }
  }
  for (const n of (c.nfz||[])) {
    for (const ring of (n.rings||[])) {
      const poly = L.polygon(ring, { color:'#f87171', weight:1.5, dashArray:'4 4', fillColor:'#f87171', fillOpacity:0.12 });
      poly.bindTooltip('NFZ '+ (n.id||''));
      layerGroup.addLayer(poly);
      ring.forEach(ll => bounds.push(ll));
    }
  }
  for (const a of (c.aerodromes||[])) {
    const m = L.circleMarker([a.lat, a.lon], { radius:7, color:'#fbbf24', fillColor:'#fbbf24', fillOpacity:0.9, weight:2 });
    m.bindTooltip(a.id);
    layerGroup.addLayer(m);
    bounds.push([a.lat, a.lon]);
  }
  for (const r of (c.routes||[])) {
    for (const seg of (r.swaths||[])) {
      if (seg.length < 2) continue;
      const pl = L.polyline(seg, { color:r.color, weight:3, opacity:0.9 });
      pl.bindTooltip(`${r.uav_id} #${r.flight_index}`);
      layerGroup.addLayer(pl);
      seg.forEach(ll => bounds.push(ll));
    }
  }
  // Tight frame: prefer survey rings + route points (NFZ/aerodromes only if no survey/route pts).
  const focus = [];
  for (const s of (c.surveys||[])) {
    for (const ring of (s.rings||[])) ring.forEach(ll => focus.push(ll));
  }
  for (const r of (c.routes||[])) {
    for (const seg of (r.swaths||[])) seg.forEach(ll => focus.push(ll));
  }
  const use = focus.length ? focus : bounds;
  if (use.length) {
    let minLat=use[0][0], maxLat=use[0][0], minLng=use[0][1], maxLng=use[0][1];
    for (const ll of use) {
      if (ll[0]<minLat) minLat=ll[0]; if (ll[0]>maxLat) maxLat=ll[0];
      if (ll[1]<minLng) minLng=ll[1]; if (ll[1]>maxLng) maxLng=ll[1];
    }
    const pad = 0.20; // fractional padding ~0.15–0.25
    const dLat = Math.max((maxLat-minLat)*pad, 0.0008);
    const dLng = Math.max((maxLng-minLng)*pad, 0.0012);
    map.fitBounds([[minLat-dLat, minLng-dLng],[maxLat+dLat, maxLng+dLng]], { padding:[18,18], maxZoom:17 });
  } else {
    map.setView([55.0, 38.53], 12);
  }
}

renderTabs();
renderCase();

</script>
